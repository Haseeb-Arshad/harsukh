<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <!-- Growth chart background -->
  <rect x="8" y="12" width="48" height="40" rx="4" stroke="#2E5C3E" stroke-width="2" fill="rgba(46, 92, 62, 0.05)"/>
  
  <!-- Chart grid lines -->
  <line x1="12" y1="20" x2="52" y2="20" stroke="#2E5C3E" stroke-width="0.5" opacity="0.3"/>
  <line x1="12" y1="30" x2="52" y2="30" stroke="#2E5C3E" stroke-width="0.5" opacity="0.3"/>
  <line x1="12" y1="40" x2="52" y2="40" stroke="#2E5C3E" stroke-width="0.5" opacity="0.3"/>
  
  <!-- Growth line -->
  <path d="M12 45L20 38L28 32L36 25L44 18L52 12" stroke="#2E5C3E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Data points -->
  <circle cx="12" cy="45" r="2" fill="#2E5C3E"/>
  <circle cx="20" cy="38" r="2" fill="#2E5C3E"/>
  <circle cx="28" cy="32" r="2" fill="#2E5C3E"/>
  <circle cx="36" cy="25" r="2" fill="#2E5C3E"/>
  <circle cx="44" cy="18" r="2" fill="#2E5C3E"/>
  <circle cx="52" cy="12" r="2" fill="#2E5C3E"/>
  
  <!-- Upward arrow -->
  <path d="M48 8L52 12L48 16" stroke="#2E5C3E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Dollar sign -->
  <circle cx="20" cy="58" r="6" fill="#2E5C3E"/>
  <text x="20" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="white" font-weight="bold">$</text>
</svg>
